name: PersonaGraph CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - "scripts/**"
      - "deploy/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "AGENTS.md"
      - "improvement.md"
      - "future-improvement.md"
      - ".github/workflows/personagraph-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - "scripts/**"
      - "deploy/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "AGENTS.md"
      - "improvement.md"
      - "future-improvement.md"
      - ".github/workflows/personagraph-ci.yml"

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compliance scan
        run: python3 scripts/compliance_scan.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync backend dependencies
        run: uv sync
      - name: Run backend tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
