[project]
name = "personagraph-backend"
version = "0.1.0"
description = "PersonaGraph backend service"
requires-python = ">=3.11"
dependencies = [
    "camel-ai==0.2.78",
    "camel-oasis==0.2.5",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "openai>=1.0,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pypdf>=5.1,<6.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "uvicorn[standard]>=0.31,<1.0",
]

[project.scripts]
personagraph-worker = "app.worker:main"

[dependency-groups]
dev = [
    "pytest==8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
