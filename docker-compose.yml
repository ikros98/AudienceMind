services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personagraph
      POSTGRES_USER: personagraph
      POSTGRES_PASSWORD: personagraph
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      PERSONAGRAPH_DATABASE_URL: postgresql+psycopg://personagraph:personagraph@postgres:5432/personagraph
      PERSONAGRAPH_DATA_DIR: /data
      PERSONAGRAPH_EMBED_WORKFLOW_RUNNER: "false"
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - personagraph_data:/data

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      PERSONAGRAPH_DATABASE_URL: postgresql+psycopg://personagraph:personagraph@postgres:5432/personagraph
      PERSONAGRAPH_DATA_DIR: /data
    depends_on:
      - postgres
    volumes:
      - personagraph_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "4173:80"

volumes:
  pg_data:
  personagraph_data:
